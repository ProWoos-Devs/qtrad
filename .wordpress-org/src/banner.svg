<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500" role="img" aria-labelledby="title desc">
  <title id="title">qTrad — Multilingual content for WordPress</title>
  <desc id="desc">Keeps your qTranslate and qTranslate-X translations, with accessible editing and multilingual SEO. One stored field contains English, German and Spanish translations. Comment, bracket and swirly markers are supported.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091d47"/>
      <stop offset="1" stop-color="#17479e"/>
    </linearGradient>
    <radialGradient id="light">
      <stop offset="0" stop-color="#5c9fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5c9fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000c2a" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <ellipse cx="1120" cy="205" rx="640" ry="450" fill="url(#light)"/>
  <!-- An understated marker pattern replaces the generic speech-bubble texture. -->
  <g font-family="DejaVu Sans Mono" fill="#a7c9ff" opacity="0.1" font-size="35">
    <text x="620" y="70" transform="rotate(-8 620 70)">&lt;!--:en--&gt;</text>
    <text x="731" y="193" transform="rotate(6 731 193)">{:de}</text>
    <text x="730" y="450" transform="rotate(-7 730 450)">[:es]</text>
  </g>
  <g fill="none" stroke="#9cc3ff" stroke-opacity="0.1" stroke-width="1.5">
    <path d="M836 48V434Q836 466 868 466H1484"/>
    <path d="M1520 31H906Q874 31 874 63V458"/>
  </g>
  <!-- The established name, tagline and descriptive wording are unchanged. -->
  <g font-family="Noto Sans CJK JP" fill="#ffffff">
    <text x="88" y="214" font-size="132" font-weight="700" letter-spacing="-2">qTrad</text>
    <text x="92" y="290" font-size="42" font-weight="500" fill="#9cc3ff">Multilingual content for WordPress</text>
    <text x="92" y="352" font-size="29" font-weight="400" fill="#d7e5ff">Keeps your qTranslate and qTranslate-X translations,</text>
    <text x="92" y="394" font-size="29" font-weight="400" fill="#d7e5ff">with accessible editing and multilingual SEO.</text>
  </g>
  <!-- Three inherited syntaxes, presented as examples rather than new marketing copy. -->
  <g fill="#ffffff" fill-opacity="0.055" stroke="#9cc3ff" stroke-opacity="0.22">
    <rect x="92" y="426" width="180" height="40" rx="10"/>
    <rect x="284" y="426" width="116" height="40" rx="10"/>
    <rect x="412" y="426" width="116" height="40" rx="10"/>
  </g>
  <g font-family="DejaVu Sans Mono" font-size="21" fill="#c3dcff" text-anchor="middle">
    <text x="182" y="453">&lt;!--:en--&gt;</text>
    <text x="342" y="453">[:en]</text>
    <text x="470" y="453">{:en}</text>
  </g>
  <!-- The editor and the multilingual storage are two views of the same field. -->
  <rect x="895" y="58" width="564" height="384" rx="24" fill="#7baeff" fill-opacity="0.24" transform="rotate(-3 1177 250)"/>
  <rect x="914" y="65" width="564" height="384" rx="24" fill="#4388f0" fill-opacity="0.34" transform="rotate(3 1196 257)"/>
  <g transform="translate(900 50)" filter="url(#shadow)">
    <rect width="572" height="400" rx="22" fill="url(#paper)"/>
    <path d="M22 0H550A22 22 0 0 1 572 22V55H0V22A22 22 0 0 1 22 0Z" fill="#edf3fe"/>
    <circle cx="29" cy="27" r="6" fill="#9cc3ff"/>
    <circle cx="49" cy="27" r="6" fill="#b6cff3"/>
    <circle cx="69" cy="27" r="6" fill="#cfddf3"/>
    <text x="536" y="34" text-anchor="end" font-family="DejaVu Sans Mono" font-size="16" fill="#5a6b86">post_content</text>
    <g font-family="Noto Sans CJK JP" font-size="24" font-weight="500">
      <rect x="36" y="79" width="150" height="49" rx="10" fill="#ffffff" stroke="#c7d3e6" stroke-width="1.5"/>
      <text x="111" y="112" text-anchor="middle" fill="#3b4a63">English</text>
      <rect x="198" y="79" width="150" height="49" rx="10" fill="#1d4ed8"/>
      <text x="273" y="112" text-anchor="middle" fill="#ffffff">Deutsch</text>
      <rect x="360" y="79" width="150" height="49" rx="10" fill="#ffffff" stroke="#c7d3e6" stroke-width="1.5"/>
      <text x="435" y="112" text-anchor="middle" fill="#3b4a63">Español</text>
    </g>
    <text x="36" y="184" font-family="Noto Sans CJK JP" font-size="36" font-weight="700" fill="#0b1f4d">Willkommen im Weinladen</text>
    <rect x="36" y="204" width="500" height="10" rx="5" fill="#dfe8f7"/>
    <rect x="36" y="225" width="419" height="10" rx="5" fill="#e7edf8"/>
    <text x="36" y="263" font-family="Noto Sans CJK JP" font-size="17" fill="#536888">One field · all translations</text>
    <rect x="36" y="276" width="500" height="102" rx="12" fill="#eaf0fb"/>
    <rect x="47" y="310" width="478" height="30" rx="6" fill="#d9e6ff"/>
    <path d="M54 318V332" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    <g font-family="DejaVu Sans Mono" font-size="21">
      <text x="67" y="302" fill="#516783"><tspan fill="#4b73ad">[:en]</tspan>Welcome to the wine shop</text>
      <text x="67" y="333" fill="#0b1f4d"><tspan fill="#1d4ed8">[:de]</tspan>Willkommen im Weinladen</text>
      <text x="67" y="364" fill="#516783"><tspan fill="#4b73ad">[:es]</tspan>Bienvenido a la vinoteca<tspan fill="#4b73ad">[:]</tspan></text>
    </g>
  </g>
</svg>
