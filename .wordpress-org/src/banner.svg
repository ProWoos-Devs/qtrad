<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#123a8c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <!-- faint speech bubbles in the background -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="18">
    <path d="M520 40 h260 a60 60 0 0 1 60 60 v120 a60 60 0 0 1 -60 60 h-150 l-70 60 v-60 h-40 a60 60 0 0 1 -60 -60 v-120 a60 60 0 0 1 60 -60 z"/>
    <path d="M610 250 h220 a50 50 0 0 1 50 50 v100 a50 50 0 0 1 -50 50 h-30 v50 l-60 -50 h-130 a50 50 0 0 1 -50 -50 v-100 a50 50 0 0 1 50 -50 z"/>
  </g>
  <g font-family="Noto Sans CJK JP" fill="#ffffff">
    <text x="88" y="214" font-size="132" font-weight="700" letter-spacing="-2">qTrad</text>
    <text x="92" y="290" font-size="42" font-weight="500" fill="#9cc3ff">Multilingual content for WordPress</text>
    <text x="92" y="352" font-size="29" font-weight="400" fill="#d7e5ff">Keeps your qTranslate and qTranslate-X translations,</text>
    <text x="92" y="394" font-size="29" font-weight="400" fill="#d7e5ff">with accessible editing and multilingual SEO.</text>
  </g>
  <!-- editor card -->
  <g transform="translate(900 62)" filter="url(#shadow)">
    <rect width="572" height="376" rx="22" fill="#ffffff"/>
    <rect width="572" height="58" rx="22" fill="#eef3fb"/>
    <rect y="36" width="572" height="22" fill="#eef3fb"/>
    <circle cx="34" cy="29" r="8" fill="#c7d3e6"/><circle cx="60" cy="29" r="8" fill="#c7d3e6"/><circle cx="86" cy="29" r="8" fill="#c7d3e6"/>
    <g font-family="Noto Sans CJK JP" font-size="24" font-weight="500">
      <rect x="36" y="86" width="150" height="50" rx="10" fill="#ffffff" stroke="#c7d3e6" stroke-width="2"/>
      <text x="111" y="119" text-anchor="middle" fill="#3b4a63">English</text>
      <rect x="198" y="86" width="150" height="50" rx="10" fill="#1d4ed8"/>
      <text x="273" y="119" text-anchor="middle" fill="#ffffff">Deutsch</text>
      <rect x="360" y="86" width="150" height="50" rx="10" fill="#ffffff" stroke="#c7d3e6" stroke-width="2"/>
      <text x="435" y="119" text-anchor="middle" fill="#3b4a63">Español</text>
    </g>
    <g font-family="Noto Sans CJK JP">
      <text x="36" y="196" font-size="38" font-weight="700" fill="#0b1f4d">Willkommen im Weinladen</text>
      <rect x="36" y="222" width="500" height="14" rx="7" fill="#e3eaf5"/>
      <rect x="36" y="248" width="440" height="14" rx="7" fill="#e3eaf5"/>
      <rect x="36" y="274" width="470" height="14" rx="7" fill="#e3eaf5"/>
    </g>
    <rect x="36" y="308" width="500" height="44" rx="10" fill="#f4f7fc"/>
    <text x="52" y="337" font-family="DejaVu Sans Mono" font-size="17" fill="#5a6b86">[:en]Welcome[:de]Willkommen[:es]Bienvenido[:]</text>
  </g>
